
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Văn Khắc Profile</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <main class="page">
    <header class="profile">
      <div class="avatar-ring">
        <img class="avatar" src="./IMG_20261009_235200.jpg" alt="Ảnh đại diện">
        <span class="star">✦</span>
      </div>
      <h1>Nguyễn Văn Khắc</h1>
      <p class="subtitle">Một chút nỗ lực, một chút may mắn ☆</p>
      <nav class="socials">
        <a class="social-btn" href="https://facebook.com/">
          <i class="fa-brands fa-facebook"></i> Facebook
        </a>
        <a class="social-btn" href="https://discord.com/">
          <i class="fa-brands fa-discord"></i> Discord
        </a>
        <a class="social-btn" href="https://github.com/hanulz">
          <i class="fa-solid fa-link"></i> More
        </a>
      </nav>
    </header>
    <section class="music-panel">
      <div class="music-icon">
        <i class="fa-solid fa-music"></i>
      </div>
      <div class="music-info">
        <strong id="musicTitle">Click để phát nhạc</strong>
        <p>Enjoy your time ♬</p>
      </div>
      <button id="playBtn" class="play-btn" aria-label="Phát nhạc">
        <i class="fa-solid fa-play"></i>
      </button>
      <audio id="music" src="./damchim.mp3" loop preload="none"></audio>
    </section>

    <section class="quote">
      <div class="divider">★</div>
      <p>“Không có con đường nào là dễ dàng<br>
      nhưng sẽ có con đường phù hợp với bạn.”</p>
      <span>✧</span>
    </section>

    <footer class="footer">
      ☆ ♡ ☾ &nbsp; © 2026 Nguyễn Văn Khắc &nbsp; ☆ ♡ ☆
    </footer>
  </main>

  <script>
    const music = document.getElementById("music");
    const button = document.getElementById("playBtn");
    const title = document.getElementById("musicTitle");
    const icon = button.querySelector("i");

    button.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
        } catch (error) {
          title.textContent = "Không phát được nhạc";
        }
      } else {
        music.pause();
      }
    });

    music.addEventListener("playing", () => {
      title.textContent = "Đang phát nhạc ♪";
      icon.className = "fa-solid fa-pause";
    });

    music.addEventListener("pause", () => {
      title.textContent = "Click để phát nhạc";
      icon.className = "fa-solid fa-play";
    });
  </script>
  
<script>
(() => {
  const count = 16;

  for (let i = 0; i < count; i++) {
    const particle = document.createElement("span");
    particle.className = "floating-particle";

    const size = 2 + Math.random() * 4;
    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDelay = -(Math.random() * 12) + "s";
    particle.style.animationDuration = (8 + Math.random() * 7) + "s";

    document.body.appendChild(particle);
  }
})();
</script>
</body>
</html>
