<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0758b9">
<title>Nguyễn Văn Khắc | Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--white:#fff;--ice:#dff8ff;--glass:rgba(4,65,139,.46);--line:rgba(225,250,255,.92)}
*{box-sizing:border-box}
html{min-height:100%;background:#0758a9;scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;font-family:Poppins,Arial,sans-serif;color:#fff;background:#0758a9 linear-gradient(180deg,rgba(3,34,83,.30),rgba(2,39,91,.48)),url("./background.png") center top/cover no-repeat;background-attachment:scroll}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.page{position:relative;z-index:1;width:min(760px,92%);margin:0 auto;padding:42px 0 28px;text-align:center}
.profile{display:flex;flex-direction:column;align-items:center}
.avatar-ring{position:relative;width:154px;height:154px;margin:0 auto 22px;padding:7px;border:2px solid #fff;border-radius:50%;background:rgba(31,143,255,.25);box-shadow:0 0 0 5px rgba(68,199,255,.25),0 0 24px #64ddff,inset 0 0 15px #ffffff66;animation:glow 3s ease-in-out infinite alternate}
.avatar{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #ffffffeb}
.star{position:absolute;right:-13px;top:2px;color:white;font-size:31px;text-shadow:0 0 12px white,0 0 25px #5ee7ff;animation:twinkle 1.8s ease-in-out infinite}
h1{margin:0;font-size:clamp(30px,7vw,54px);line-height:1.18;font-weight:800;font-style:italic;letter-spacing:-.8px;text-shadow:0 3px 0 #1d8fffaa,0 0 10px #a4f0ff,0 0 28px #50c9ffe6}
.title-divider,.divider{display:flex;align-items:center;justify-content:center;gap:18px;color:white;text-shadow:0 0 14px #8ceaff}
.title-divider{width:min(390px,82%);margin:12px auto 8px;font-size:25px}
.title-divider:before,.title-divider:after,.divider:before,.divider:after{content:"";height:2px;flex:1;background:white;box-shadow:0 0 8px #8ceaff}
.subtitle{margin:8px 0 30px;padding:8px 17px;color:#fff;font-size:clamp(13px,3.4vw,19px);font-weight:600;background:rgba(5,87,177,.6);border:1px solid #c5f4ffb3;border-radius:999px;box-shadow:0 0 18px #5fdbff47;text-shadow:0 1px 8px #0054ad}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;margin-bottom:28px}
.social-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:12px 23px;border:1.5px solid var(--line);border-radius:999px;background:linear-gradient(135deg,#5ac0ff66,#004cb38f);box-shadow:0 0 12px #64dbff73,inset 0 0 12px #ffffff1a;color:white;text-decoration:none;font-size:15px;font-weight:500;transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.social-btn i{font-size:22px}
.music-panel{display:flex;align-items:center;gap:16px;min-height:130px;margin:0 0 35px;padding:18px 22px;border:1.5px solid var(--line);border-radius:34px;background:linear-gradient(115deg,#47adff8c,#04397e9e);box-shadow:0 0 20px #64dbff8c,inset 0 0 20px #ffffff1f;text-align:left;backdrop-filter:blur(3px)}
.music-icon{flex:0 0 76px;width:76px;height:76px;display:grid;place-items:center;border-radius:23px;background:#02317380;border:1px solid #ffffff73;font-size:35px;box-shadow:inset 0 0 15px #ffffff1f}
.music-info{flex:1;min-width:0}.music-info strong{display:block;font-size:clamp(14px,3.5vw,20px)}.music-info p{margin:5px 0 0;color:var(--ice);font-size:13px}
.play-btn{flex:0 0 66px;width:66px;height:66px;display:grid;place-items:center;border:2px solid white;border-radius:50%;background:#0042998c;color:white;font-size:22px;cursor:pointer;box-shadow:0 0 15px #93edff59;transition:transform .18s ease,box-shadow .18s ease}
.quote{padding:0 6px 12px;text-align:center}.divider{gap:20px;margin:0 auto 23px;width:min(520px,85%);font-size:30px}.quote p{margin:0 auto 20px;max-width:600px;font-size:clamp(15px,3.8vw,21px);font-style:italic;line-height:1.9;font-weight:500;text-shadow:0 2px 10px #003b88,0 0 12px #7de2ffb3}.quote-mark{color:white;font-size:26px;text-shadow:0 0 12px #8ceaff}
.footer{padding:24px 0 12px;color:#f2fcff;font-size:12px;text-shadow:0 1px 8px #003c85}
.floating-particle{position:fixed;bottom:-20px;z-index:0;border-radius:50%;background:#fff;pointer-events:none;user-select:none;box-shadow:0 0 8px #fff,0 0 16px #ffffffcc;opacity:0;animation:float-up linear infinite;will-change:transform,opacity}
.shooting-star{position:fixed;z-index:0;top:-10vh;left:0;width:2px;height:80px;pointer-events:none;opacity:0;background:linear-gradient(to bottom,transparent,#fff,#99ebff00);box-shadow:0 0 9px #fff,0 0 18px #79dfff;transform:rotate(38deg);animation:shoot 1.25s linear forwards}
.social-btn:active,.play-btn:active{transform:translateY(-4px) scale(1.035);box-shadow:0 8px 24px #82e8ffcc,0 0 22px #ffffff8c;background-color:#99e5ff73}
.social-btn:focus-visible,.play-btn:focus-visible{outline:3px solid white;outline-offset:4px}
@keyframes float-up{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.8}80%{opacity:.6}100%{transform:translate3d(24px,-110vh,0);opacity:0}}
@keyframes shoot{0%{transform:translate3d(0,0,0) rotate(38deg);opacity:0}10%{opacity:1}100%{transform:translate3d(75vw,75vh,0) rotate(38deg);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.9);opacity:.75}50%{transform:scale(1.15);opacity:1}}
@keyframes glow{from{box-shadow:0 0 0 4px #44c7ff33,0 0 17px #64ddff}to{box-shadow:0 0 0 6px #44c7ff57,0 0 30px #64ddff}}
@media(hover:hover){.social-btn:hover,.play-btn:hover{transform:translateY(-4px);box-shadow:0 8px 25px #82e8ffa6}}
@media(max-width:520px){.page{width:92%;padding-top:32px}.avatar-ring{width:135px;height:135px;margin-bottom:20px}.subtitle{margin-bottom:24px}.socials{gap:8px}.social-btn{flex:1 1 28%;min-width:0;gap:7px;padding:11px 7px;min-height:52px;font-size:12px}.social-btn i{font-size:18px}.music-panel{gap:11px;padding:14px 12px;min-height:104px;border-radius:25px}.music-icon{flex-basis:54px;width:54px;height:54px;border-radius:17px;font-size:27px}.play-btn{flex-basis:52px;width:52px;height:52px;font-size:18px}.quote p{line-height:1.8}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="page">
  <header class="profile">
    <div class="avatar-ring">
      <img class="avatar" src="./IMG_20261009_235200.jpg" alt="Ảnh đại diện">
      <span class="star" aria-hidden="true">✦</span>
    </div>
    <h1>Nguyễn Văn Khắc</h1>
    <div class="title-divider" aria-hidden="true">★</div>
    <p class="subtitle">Một chút nỗ lực, một chút may mắn ☆</p>
    <nav class="socials" aria-label="Liên kết mạng xã hội">
      <a class="social-btn" href="https://facebook.com/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook" aria-hidden="true"></i> Facebook</a>
      <a class="social-btn" href="https://discord.com/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-discord" aria-hidden="true"></i> Discord</a>
      <a class="social-btn" href="https://github.com/hanulz" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-link" aria-hidden="true"></i> More</a>
    </nav>
  </header>
  <section class="music-panel" aria-label="Trình phát nhạc">
    <div class="music-icon"><i class="fa-solid fa-music" aria-hidden="true"></i></div>
    <div class="music-info"><strong id="musicTitle">Click để phát nhạc</strong><p>Enjoy your time ♬</p></div>
    <button id="playBtn" class="play-btn" type="button" aria-label="Phát nhạc"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
    <audio id="music" src="./damchim.mp3" loop preload="none"></audio>
  </section>
  <section class="quote">
    <div class="divider" aria-hidden="true">★</div>
    <p>“Không có con đường nào là dễ dàng<br>nhưng sẽ có con đường phù hợp với bạn.”</p>
    <div class="quote-mark" aria-hidden="true">✧</div>
  </section>
  <footer class="footer">☆ ♡ ☾ &nbsp; © 2026 Nguyễn Văn Khắc &nbsp; ☆ ♡ ☆</footer>
</main>
<script>
(() => {
  const music = document.getElementById("music");
  const button = document.getElementById("playBtn");
  const title = document.getElementById("musicTitle");
  const icon = button.querySelector("i");
  button.addEventListener("click", async () => {
    if (music.paused) {
      try { await music.play(); }
      catch (error) { title.textContent = "Không phát được nhạc"; }
    } else { music.pause(); }
  });
  music.addEventListener("playing", () => {
    title.textContent = "Đang phát nhạc ♪";
    icon.className = "fa-solid fa-pause";
    button.setAttribute("aria-label", "Tạm dừng nhạc");
  });
  music.addEventListener("pause", () => {
    title.textContent = "Click để phát nhạc";
    icon.className = "fa-solid fa-play";
    button.setAttribute("aria-label", "Phát nhạc");
  });
  for (let i = 0; i < 18; i++) {
    const particle = document.createElement("span");
    particle.className = "floating-particle";
    const size = 2 + Math.random() * 3;
    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.animationDelay = -(Math.random() * 14) + "s";
    particle.style.animationDuration = (9 + Math.random() * 8) + "s";
    document.body.appendChild(particle);
  }
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    function makeShootingStar() {
      const star = document.createElement("span");
      star.className = "shooting-star";
      star.style.left = (Math.random() * 65) + "vw";
      star.style.top = (-10 - Math.random() * 20) + "vh";
      document.body.appendChild(star);
      star.addEventListener("animationend", () => star.remove(), { once: true });
      window.setTimeout(makeShootingStar, 1800 + Math.random() * 2800);
    }
    window.setTimeout(makeShootingStar, 900);
  }
})();
</script>
</body>
</html>
